<!doctype html>
<html>
  <head>
    <title>CastPA Auth</title>
  </head>
  <body>
    <script>
      var query = window.location.search;
      if (query) {
        window.location = "castpa://auth/callback" + query;
      } else {
        document.body.innerText = "No auth parameters.";
      }
    </script>
    <p>Redirecting back to CastPA...</p>
  </body>
</html>
